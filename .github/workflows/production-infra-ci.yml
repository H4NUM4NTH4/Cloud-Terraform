
name: Production Infra CI/CD

on:
  pull_request:
    paths:
      - 'terraform/production-infra/**'
      - '.github/workflows/production-infra-ci.yml'
  push:
    branches:
      - main
      - ci-cd-hands-on
    paths:
      - 'terraform/production-infra/**'
      - '.github/workflows/production-infra-ci.yml'

permissions:
  contents: read

concurrency:
  group: production-infra-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Terraform validation and security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8

      - name: Check Terraform formatting
        working-directory: terraform/production-infra
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without AWS backend access
        working-directory: terraform/production-infra/environments/dev
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        working-directory: terraform/production-infra/environments/dev
        run: terraform validate

      - name: Scan Terraform configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform/production-infra
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  plan:
    name: Terraform plan (dev)
    runs-on: ubuntu-latest
    needs: validate
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/ci-cd-hands-on')

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: terraform/production-infra/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::612524169043:role/GitHubActions-Terraform-Infra
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Initialize Terraform with S3 backend
        run: terraform init -input=false

      - name: Generate Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Upload reviewed Terraform plan
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: production-infra-dev-plan
          path: terraform/production-infra/environments/dev/tfplan
          retention-days: 1
          if-no-files-found: error

  apply:
    name: Apply Terraform plan (dev)
    runs-on: ubuntu-latest
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment: production

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: terraform/production-infra/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.8

      - name: Download reviewed Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: production-infra-dev-plan
          path: terraform/production-infra/environments/dev

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::612524169043:role/GitHubActions-Terraform-Infra
          aws-region: ap-south-1

      - name: Initialize Terraform with S3 backend
        run: terraform init -input=false

      - name: Apply reviewed Terraform plan
        run: terraform apply -input=false -no-color tfplan
