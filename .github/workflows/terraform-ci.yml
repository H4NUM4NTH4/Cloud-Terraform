name: Terraform CI

on:
  pull_request:
  
permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/count-hands-on

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );
            console.log('OIDC issuer:', payload.iss);
            console.log('OIDC audience:', payload.aud);
            console.log('OIDC subject:', payload.sub);
      
      - name: Test AWS OIDC directly
        uses: actions/github-script@v7
        env:
          ROLE_ARN: arn:aws:iam::612524169043:role/GitHubActions-Terraform-Count
        with:
          script: |
            const { execSync } = require('child_process');

            const token = await core.getIDToken('sts.amazonaws.com');

            core.setSecret(token);

            const fs = require('fs');
            fs.writeFileSync('/tmp/github-oidc-token', token);

            try {
              const output = execSync(
                `aws sts assume-role-with-web-identity \
                  --role-arn "${process.env.ROLE_ARN}" \
                  --role-session-name "github-oidc-debug" \
                  --web-identity-token file:///tmp/github-oidc-token`,
                { encoding: 'utf8' }
              );

              console.log(output);
            } catch (error) {
              console.log(error.stdout?.toString() || '');
              console.log(error.stderr?.toString() || '');
              throw error;
            } finally {
              fs.rmSync('/tmp/github-oidc-token', { force: true });
            }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::612524169043:role/GitHubActions-Terraform-Count
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan